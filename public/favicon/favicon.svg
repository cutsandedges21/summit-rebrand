<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="mossimo Studios">
  <!-- Echoes the logo lockup rather than inventing a mark: paper ground, the
       accent used as a shape behind the letterform, never as the letter itself.
       The blob sits off-centre and clipped by the edge exactly as it does in
       public/brand/logo-wordmark.png. -->
  <rect width="64" height="64" fill="#f9f7ef"/>
  <circle cx="44" cy="26" r="21" fill="#f9ea55"/>
  <text
    x="32"
    y="45"
    text-anchor="middle"
    font-family="Verdana, Geneva, sans-serif"
    font-size="38"
    font-weight="700"
    fill="#1b1a15"
  >m</text>
</svg>
